plugins {
    id 'com.android.application'
}

android {
    namespace 'org.bilibilidl.keepalive'
    compileSdk 35

    defaultConfig {
        applicationId 'org.bilibilidl.keepalive'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
