name: Build bilibilidl KeepAlive Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/build-helper.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi

          test -f "$SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "build-tools;35.0.0"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Project file list:"
          find . -maxdepth 10 -type f | sort

          required_files=(
            settings.gradle
            build.gradle
            gradle.properties
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/org/bilibilidl/keepalive/MainActivity.java
            app/src/main/java/org/bilibilidl/keepalive/KeepAliveService.java
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Project files are incomplete. Check the paths printed above."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK build successful:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilidl-keepalive-helper
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
