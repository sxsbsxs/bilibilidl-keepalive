name: Build bilibilidl KeepAlive APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilibilidl-keepalive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android 14 KeepAlive APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.parallel=false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Check project files
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/org/bilibilidl/keepalive/MainActivity.java
          test -f app/src/main/java/org/bilibilidl/keepalive/KeepAliveService.java

          grep -q "targetSdk 34" app/build.gradle
          grep -q "compileSdk 35" app/build.gradle
          grep -q "foregroundServiceType=\"dataSync\"" app/src/main/AndroidManifest.xml

          echo "Project checks passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p /tmp/apk-check
          unzip -q "$APK" -d /tmp/apk-check

          test -f /tmp/apk-check/classes.dex
          echo "APK build verification passed."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilidl-keepalive-android14
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibilidl-keepalive-build-logs
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
